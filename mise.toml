[tools]
# Azure CLI provides the Bicep CLI via `az bicep`.
azure = "latest"
gh = "latest"

[tasks.lint]
description = "Compile/lint all Bicep (no deploy)"
run = """
az bicep build --file bootstrap/main.bicep --stdout > /dev/null && echo 'bootstrap OK'
az bicep build --file bicep/platform.bicep --stdout > /dev/null && echo 'platform OK'
az bicep build --file bicep/app.bicep --stdout > /dev/null && echo 'app OK'
az bicep build-params --file platform/dev.bicepparam --stdout > /dev/null && echo 'dev/platform params OK'
az bicep build-params --file platform/prod.bicepparam --stdout > /dev/null && echo 'prod/platform params OK'
az bicep build-params --file apps/dev/vesperp4-api.bicepparam --stdout > /dev/null && echo 'dev/api params OK'
az bicep build-params --file apps/prod/vesperp4-api.bicepparam --stdout > /dev/null && echo 'prod/api params OK'
"""

[tasks.bootstrap-whatif]
description = "Preview the bootstrap deployment (requires az login as an admin)"
run = "az deployment sub what-if --location eastus2 --template-file bootstrap/main.bicep --parameters bootstrap/main.bicepparam"

[tasks.bootstrap-deploy]
description = "Deploy the identity/foundation bootstrap (requires az login as an admin)"
run = "az deployment sub create --name vesperp4-bootstrap --location eastus2 --template-file bootstrap/main.bicep --parameters bootstrap/main.bicepparam"
