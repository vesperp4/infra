[tools]
# Azure CLI provides the Bicep CLI via `az bicep`.
azure = "latest"
gh = "latest"

# CI quality tooling — lint workflows and shell scripts locally.
actionlint = "latest"
shellcheck = "latest"

# ===========================================================================
# `mise run` is the front door. Run `mise tasks` to see everything.
# Before pushing: `mise run check`. Deploys run in CI; the bootstrap-* tasks
# below are the only ones a human runs by hand (admin az login required).
# ===========================================================================

# --- Quality gates: run `mise run check` before pushing --------------------

[tasks.lint]
description = "Compile every Bicep template + param file (no deploy)"
shell = "bash -c"
run = """
set -euo pipefail
for f in bootstrap/main.bicep bicep/*.bicep; do
  az bicep build --file "$f" --stdout > /dev/null && echo "OK  $f"
done
for f in bootstrap/main.bicepparam platform/*.bicepparam apps/*/*/*.bicepparam; do
  az bicep build-params --file "$f" --stdout > /dev/null && echo "OK  $f"
done
"""

[tasks.lint-workflows]
description = "Lint GitHub Actions workflows with actionlint"
run = "actionlint"

[tasks.lint-scripts]
description = "Lint shell scripts with shellcheck"
run = "shellcheck scripts/*.sh"

[tasks.check]
description = "Run all local gates (bicep + workflows + scripts). Run before pushing."
depends = ["lint", "lint-workflows", "lint-scripts"]

# --- Bootstrap (admin, run by hand) ----------------------------------------

[tasks.bootstrap-whatif]
description = "Preview the bootstrap deployment (requires az login as an admin)"
run = "az deployment sub what-if --location eastus2 --template-file bootstrap/main.bicep --parameters bootstrap/main.bicepparam"

[tasks.bootstrap-deploy]
description = "Deploy the identity/foundation bootstrap (requires az login as an admin)"
run = "az deployment sub create --name vesperp4-bootstrap --location eastus2 --template-file bootstrap/main.bicep --parameters bootstrap/main.bicepparam"
