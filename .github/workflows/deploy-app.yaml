name: Deploy App

# Deploys application stacks (each = its own Postgres server + database +
# Container App) onto the shared platform. Generic over apps: a new app is just
# a new apps/<env>/<app>.bicepparam file — this workflow discovers it, deploys
# it, and onboards its passwordless DB role automatically. Prod is gated by the
# `prod` environment's required reviewers.
on:
  push:
    branches: [main]
    paths:
      - 'bicep/app.bicep'
      - 'bicep/modules/containerapp.bicep'
      - 'bicep/modules/postgres.bicep'
      - 'apps/**/*.bicepparam'
      - 'scripts/onboard-app-db.sh'
      - '.github/workflows/deploy-app.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-app-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Azure OIDC login

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      has: ${{ steps.set.outputs.has }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - id: set
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # A change to the shared app template/modules/script redeploys every app;
          # otherwise only the app param files that changed in this push.
          shared_re='^(bicep/app\.bicep|bicep/modules/(containerapp|postgres)\.bicep|scripts/onboard-app-db\.sh|\.github/workflows/deploy-app\.yaml)$'
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "${BEFORE:-}" ] \
             || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git rev-parse --verify "${BEFORE}^{commit}" >/dev/null 2>&1; then
            files="$(git ls-files 'apps/*/*.bicepparam')"
          else
            changed="$(git diff --name-only "$BEFORE" "${{ github.sha }}")"
            if echo "$changed" | grep -qE "$shared_re"; then
              files="$(git ls-files 'apps/*/*.bicepparam')"
            else
              files="$(echo "$changed" | grep -E '^apps/[^/]+/[^/]+\.bicepparam$' || true)"
            fi
          fi
          matrix='[]'
          for f in $files; do
            env="$(echo "$f" | cut -d/ -f2)"
            app="$(basename "$f" .bicepparam)"
            matrix="$(echo "$matrix" | jq -c --arg a "$app" --arg e "$env" '. + [{"app":$a,"environment":$e}]')"
          done
          {
            echo "matrix=$(echo "$matrix" | jq -c '{include: .}')"
            echo "has=$(echo "$matrix" | jq 'length > 0')"
          } >> "$GITHUB_OUTPUT"

  deploy:
    needs: discover
    if: ${{ needs.discover.outputs.has == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    # Sets the env-scoped AZURE_CLIENT_ID and (for prod) the reviewer gate.
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Azure login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy ${{ matrix.app }} (${{ matrix.environment }})
        id: deploy
        run: |
          rg="vesperp4-${{ matrix.environment }}-rg"
          name="${{ matrix.app }}-${{ github.run_id }}"
          az deployment group create \
            --resource-group "$rg" \
            --name "$name" \
            --parameters "apps/${{ matrix.environment }}/${{ matrix.app }}.bicepparam"
          server="$(az deployment group show -g "$rg" -n "$name" --query properties.outputs.postgresServerName.value -o tsv)"
          db="$(az deployment group show -g "$rg" -n "$name" --query properties.outputs.databaseName.value -o tsv)"
          {
            echo "server=$server"
            echo "db=$db"
          } >> "$GITHUB_OUTPUT"
      - name: Onboard DB role
        run: |
          bash scripts/onboard-app-db.sh \
            "vesperp4-${{ matrix.environment }}-rg" \
            "${{ steps.deploy.outputs.server }}" \
            "${{ steps.deploy.outputs.db }}" \
            "id-app-${{ matrix.environment }}" \
            "vesperp4-shared-rg"
