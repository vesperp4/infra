name: Deploy App

# Deploys application stacks (each = its own Postgres server + database +
# Container App) onto the shared platform. Generic over apps: a new component is
# just a new apps/<env>/<app-group>/<component>.bicepparam file — this workflow
# discovers it, deploys it, and onboards its passwordless DB role automatically.
# Prod is gated by the
# `prod` environment's required reviewers.
on:
  push:
    branches: [main]
    paths:
      - 'bicep/app.bicep'
      - 'bicep/web.bicep'
      - 'bicep/modules/containerapp.bicep'
      - 'bicep/modules/postgres.bicep'
      - 'bicep/modules/staticwebapp.bicep'
      - 'apps/**/*.bicepparam'
      - 'scripts/onboard-app-db.sh'
      - '.github/workflows/deploy-app.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-app-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Azure OIDC login

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      has: ${{ steps.set.outputs.has }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - id: set
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # A change to the shared app template/modules/script redeploys every app;
          # otherwise only the app param files that changed in this push.
          shared_re='^(bicep/(app|web)\.bicep|bicep/modules/(containerapp|postgres|staticwebapp)\.bicep|scripts/onboard-app-db\.sh|\.github/workflows/deploy-app\.yaml)$'
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "${BEFORE:-}" ] \
             || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git rev-parse --verify "${BEFORE}^{commit}" >/dev/null 2>&1; then
            files="$(git ls-files 'apps/*/*/*.bicepparam')"
          else
            changed="$(git diff --name-only "$BEFORE" "${{ github.sha }}")"
            if echo "$changed" | grep -qE "$shared_re"; then
              files="$(git ls-files 'apps/*/*/*.bicepparam')"
            else
              files="$(echo "$changed" | grep -E '^apps/[^/]+/[^/]+/[^/]+\.bicepparam$' || true)"
            fi
          fi
          matrix='[]'
          # Param path layout: apps/<env>/<app-group>/<component>.bicepparam
          for f in $files; do
            env="$(echo "$f" | cut -d/ -f2)"
            group="$(echo "$f" | cut -d/ -f3)"
            app="$(basename "$f" .bicepparam)"
            matrix="$(echo "$matrix" | jq -c --arg a "$app" --arg g "$group" --arg e "$env" '. + [{"app":$a,"appGroup":$g,"environment":$e}]')"
          done
          {
            echo "matrix=$(echo "$matrix" | jq -c '{include: .}')"
            echo "has=$(echo "$matrix" | jq 'length > 0')"
          } >> "$GITHUB_OUTPUT"

  deploy:
    needs: discover
    if: ${{ needs.discover.outputs.has == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    # Sets the env-scoped AZURE_CLIENT_ID and (for prod) the reviewer gate.
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Azure login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: What-if (preview + destructive guard)
        run: |
          set -euo pipefail
          rg="vesperp4-${{ matrix.environment }}-rg"
          params="apps/${{ matrix.environment }}/${{ matrix.appGroup }}/${{ matrix.app }}.bicepparam"
          json="$(az deployment group what-if -g "$rg" --parameters "$params" --no-pretty-print)"
          {
            echo "### what-if — ${{ matrix.app }} (${{ matrix.environment }})"
            echo '```'
            echo "$json" | jq -r '.changes[] | "\(.changeType)  \(.resourceId | sub(".*/providers/"; ""))"' | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # An app deploy should never delete a resource. If what-if predicts one,
          # stop and let a human investigate rather than silently destroying state.
          dels="$(echo "$json" | jq '[.changes[] | select(.changeType == "Delete")] | length')"
          if [ "$dels" -gt 0 ]; then
            echo "::error::what-if predicts $dels resource deletion(s) — refusing to deploy. See the step summary."
            exit 1
          fi
      - name: Deploy ${{ matrix.app }} (${{ matrix.environment }})
        id: deploy
        run: |
          rg="vesperp4-${{ matrix.environment }}-rg"
          name="${{ matrix.app }}-${{ github.run_id }}"
          az deployment group create \
            --resource-group "$rg" \
            --name "$name" \
            --parameters "apps/${{ matrix.environment }}/${{ matrix.appGroup }}/${{ matrix.app }}.bicepparam"
          out() { az deployment group show -g "$rg" -n "$name" --query "properties.outputs.$1.value" -o tsv 2>/dev/null || true; }
          # Web components (Static Web Apps) emit no Postgres outputs — an empty
          # server signals the Onboard DB role step to skip. The web/api host
          # outputs feed the Smoke test step.
          {
            echo "server=$(out postgresServerName)"
            echo "db=$(out databaseName)"
            echo "web=$(out defaultHostname)"
            echo "api=$(out apiUrl)"
            echo "appName=$(out containerAppName)"
          } >> "$GITHUB_OUTPUT"
      - name: Onboard DB role
        if: ${{ steps.deploy.outputs.server != '' }}
        run: |
          bash scripts/onboard-app-db.sh \
            "vesperp4-${{ matrix.environment }}-rg" \
            "${{ steps.deploy.outputs.server }}" \
            "${{ steps.deploy.outputs.db }}" \
            "id-app-${{ matrix.environment }}" \
            "vesperp4-shared-rg" \
            "id-github-deploy-${{ matrix.environment }}"
      - name: Smoke test
        if: ${{ steps.deploy.outcome == 'success' }}
        env:
          WEB: ${{ steps.deploy.outputs.web }}
          API: ${{ steps.deploy.outputs.api }}
          APP_NAME: ${{ steps.deploy.outputs.appName }}
          RG: vesperp4-${{ matrix.environment }}-rg
        run: |
          set -euo pipefail
          # Web (Static Web App): the default host must serve 200. Custom domains
          # are validated out-of-band, so we probe the default host only.
          if [ -n "$WEB" ]; then
            for i in $(seq 1 10); do
              code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://$WEB/" || true)"
              if [ "$code" = "200" ]; then echo "web OK — https://$WEB ($code)"; break; fi
              echo "web try $i/10: $code"; sleep 6
              if [ "$i" = "10" ]; then echo "::error::web https://$WEB never returned 200"; exit 1; fi
            done
          fi
          # API (Container App): assert INFRA health — the revision provisioned and
          # the image pulled. The app's own /health is reported but NOT gated: the
          # service intentionally crash-loops on DATABASE_URL until the dev team
          # wires passwordless auth, so failing on it here would be a false alarm.
          if [ -n "$API" ]; then
            state="$(az containerapp show -g "$RG" -n "$APP_NAME" --query properties.provisioningState -o tsv)"
            echo "container app $APP_NAME provisioningState=$state"
            if [ "$state" != "Succeeded" ]; then
              echo "::error::container app $APP_NAME not provisioned (state=$state)"; exit 1
            fi
            running="$(az containerapp revision list -g "$RG" -n "$APP_NAME" --query "[?properties.active].properties.runningState | [0]" -o tsv 2>/dev/null || true)"
            echo "active revision runningState=$running"
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$API/health" || true)"
            echo "::notice::$API/health -> $code (informational until passwordless DB auth is wired)"
          fi
