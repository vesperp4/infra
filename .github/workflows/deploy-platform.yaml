name: Deploy Platform

# Deploys the per-environment shared platform (Container Apps environment). Runs
# on changes to the platform Bicep/params, or on demand. Prod is gated by the
# `prod` environment's required reviewers.
on:
  push:
    branches: [main]
    paths:
      - 'bicep/platform.bicep'
      - 'bicep/modules/containerapps-env.bicep'
      - 'bicep/modules/alerts-action-group.bicep'
      - 'platform/*.bicepparam'
      - '.github/workflows/deploy-platform.yaml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Azure OIDC login

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      dev: ${{ steps.filter.outputs.dev }}
      prod: ${{ steps.filter.outputs.prod }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            dev:
              - 'bicep/platform.bicep'
              - 'bicep/modules/containerapps-env.bicep'
              - 'bicep/modules/alerts-action-group.bicep'
              - '.github/workflows/deploy-platform.yaml'
              - 'platform/dev.bicepparam'
            prod:
              - 'bicep/platform.bicep'
              - 'bicep/modules/containerapps-env.bicep'
              - 'bicep/modules/alerts-action-group.bicep'
              - '.github/workflows/deploy-platform.yaml'
              - 'platform/prod.bicepparam'

  dev:
    needs: changes
    if: ${{ needs.changes.outputs.dev == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: dev
    # Per-environment lock (not workflow-level): a prod job waiting on reviewer
    # approval must never queue-block dev — see issue #28.
    concurrency:
      group: deploy-platform-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Azure login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy platform (dev)
        run: |
          az deployment group create \
            --resource-group vesperp4-dev-rg \
            --name platform-${{ github.run_id }} \
            --parameters platform/dev.bicepparam

  prod:
    needs: changes
    if: ${{ needs.changes.outputs.prod == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: prod # required-reviewer approval gate
    concurrency:
      group: deploy-platform-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Azure login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy platform (prod)
        run: |
          az deployment group create \
            --resource-group vesperp4-prod-rg \
            --name platform-${{ github.run_id }} \
            --parameters platform/prod.bicepparam
